# Render Blueprint: New > Blueprint > pick this repo. Render reads this file and creates
# the service + disk; it asks you for the values marked `sync: false`.
services:
  - type: web
    name: timetable-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 2 GB RAM. The solver needs ~0.5 GB with 2 workers and ~0.7 GB with 4 on a
    # 48-class school, so the 512 MB plans are too small. A persistent disk also needs a paid plan.
    plan: standard
    region: singapore          # closest Render region to India
    healthCheckPath: /api/v2/health
    autoDeploy: true
    disk:
      name: timetable-data
      mountPath: /data         # uploads, timetables, edit history
      sizeGB: 1
    envVars:
      - key: APP_PASSWORD      # sign-in password (user name "school"); required, see DEPLOY.md
        sync: false
      - key: GEMINI_API_KEY    # optional: enables the chat assistant
        sync: false
      - key: TIMETABLE_SOLVER_WORKERS
        value: "4"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
